apiVersion: apps/v1
kind: Deployment
metadata:
  name: tds-frontend
  namespace: default
  labels:
    app: tds-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tds-frontend
  template:
    metadata:
      labels:
        app: tds-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:5000/tds-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "300m"
              memory: 256Mi
            requests:
              cpu: "50m"
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tds-frontend
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: tds-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tds-frontend-ingress
  namespace: default
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tds-frontend
                port:
                  number: 80