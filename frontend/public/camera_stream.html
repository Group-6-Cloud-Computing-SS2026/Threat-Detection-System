<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Preview</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"
      type="text/javascript"
    ></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --card: rgba(8, 15, 28, 0.92);
        --line: rgba(148, 163, 184, 0.18);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #5eead4;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(94, 234, 212, 0.12),
            transparent 28%
          ),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 18px;
      }

      .wrap {
        display: grid;
        gap: 14px;
      }

      .toolbar,
      .frame-box {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1.6fr 1fr auto;
        gap: 10px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
      }
      input {
        background: rgba(15, 23, 42, 0.96);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #14b8a6, #0ea5e9);
        color: #04111e;
      }

      .frame-box {
        min-height: 480px;
        display: grid;
        place-items: center;
        overflow: hidden;
        position: relative;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }
      .state {
        color: var(--muted);
        text-align: center;
        max-width: 50ch;
        line-height: 1.5;
      }
      .state strong {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <label>
          Broker IP
          <input id="brokerIp" value="192.168.1.50" />
        </label>
        <label>
          WebSocket Port
          <input id="brokerPort" value="9001" />
        </label>
        <button id="connectBtn" onclick="toggleConnection()">Connect</button>
      </div>

      <div class="frame-box">
        <img id="streamFrame" alt="Live camera stream" />
        <div id="state" class="state">
          Connect to <strong>cluster/camera/stream</strong> to preview the live
          feed.
        </div>
      </div>
    </div>

    <script>
      let client = null;
      let connected = false;
      const STREAM_TOPIC = "cluster/camera/stream";

      const els = {
        brokerIp: document.getElementById("brokerIp"),
        brokerPort: document.getElementById("brokerPort"),
        connectBtn: document.getElementById("connectBtn"),
        frame: document.getElementById("streamFrame"),
        state: document.getElementById("state"),
      };

      function toggleConnection() {
        if (connected) {
          disconnect();
        } else {
          connect();
        }
      }

      function connect() {
        const host = els.brokerIp.value.trim();
        const port = parseInt(els.brokerPort.value.trim(), 10);
        if (!host || Number.isNaN(port)) {
          els.state.innerHTML = "Enter a valid broker IP and WebSocket port.";
          return;
        }

        els.connectBtn.textContent = "Connecting...";
        els.connectBtn.disabled = true;
        client = new Paho.MQTT.Client(
          host,
          port,
          "tds_preview_" + Math.random().toString(16).slice(2, 8),
        );
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({
          timeout: 5,
          useSSL: false,
          onSuccess: onConnectSuccess,
          onFailure: onConnectFailure,
        });
      }

      function disconnect() {
        try {
          client && client.disconnect();
        } catch (e) {}
        onConnectionLost({
          errorCode: 0,
          errorMessage: "Disconnected manually.",
        });
      }

      function onConnectSuccess() {
        connected = true;
        els.connectBtn.textContent = "Disconnect";
        els.connectBtn.disabled = false;
        client.subscribe(STREAM_TOPIC);
        els.state.innerHTML = "Connected. Waiting for live frames...";
      }

      function onConnectFailure(err) {
        connected = false;
        els.connectBtn.textContent = "Connect";
        els.connectBtn.disabled = false;
        els.state.innerHTML =
          "Failed to connect: " +
          (err && err.errorMessage ? err.errorMessage : "unknown error");
      }

      function onConnectionLost(responseObject) {
        connected = false;
        els.connectBtn.textContent = "Connect";
        els.connectBtn.disabled = false;
        els.frame.style.display = "none";
        els.state.style.display = "block";
        els.state.innerHTML =
          "Disconnected: " + (responseObject.errorMessage || "unknown");
      }

      function onMessageArrived(message) {
        if (message.destinationName !== STREAM_TOPIC) return;
        try {
          const payload = JSON.parse(message.payloadString);
          const image = payload.image || payload.image_base64;
          if (!image) return;
          els.frame.src = "data:image/jpeg;base64," + image;
          els.frame.style.display = "block";
          els.state.style.display = "none";
        } catch (err) {
          els.state.innerHTML = "Error reading stream frame.";
        }
      }
    </script>
  </body>
</html>
