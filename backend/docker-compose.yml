version: "3.9"

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tds-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MINIO_ENDPOINT=minio:9000
      - MQTT_BROKER_HOST=mqtt
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mqtt:
        condition: service_started
    volumes:
      - ./app:/app/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8001
      --reload --reload-dir app
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tds-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tds_user
      POSTGRES_PASSWORD: tds_secret
      POSTGRES_DB: threat_detection
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tds_user -d threat_detection"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: tds-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Mosquitto MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2
    container_name: tds-mqtt
    ports:
      - "1883:1883"
      - "9883:9001"  
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
